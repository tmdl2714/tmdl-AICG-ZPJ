name: Patch featured banner layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-featured-banner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update banner styles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('featured-projects.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('const FEATURED_VERSION = "featured-banner-camera-spacing-20260616";', 'const FEATURED_VERSION = "featured-banner-spacing-radius-20260616";')
          text = text.replace('.featured-banner-card:nth-child(2){animation-delay:-1.2s}.featured-banner-card:nth-child(3){animation-delay:-2.4s;top:-12px}.featured-banner-card:nth-child(4){animation-delay:-3.6s}', '.featured-banner-card:nth-child(2){animation-delay:-1.2s}.featured-banner-card:nth-child(3){animation-delay:-2.4s;top:-20px}.featured-banner-card:nth-child(4){animation-delay:-3.6s}')
          text = text.replace('.featured-banner-card-camera{top:-12px;border-color:transparent;border-radius:9px;background:transparent;box-shadow:none}', '.featured-banner-card-camera{top:-12px;overflow:hidden;border-color:transparent;border-radius:9px;background:transparent;box-shadow:none}')
          text = text.replace('.featured-banner-card-camera img{border-radius:9px}', '.featured-banner-card-camera img{border-radius:inherit}')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-featured-banner.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add featured-projects.js .github/workflows/patch-featured-banner.yml
          git commit -m "fix: refine featured banner spacing and corners"
          git push