name: Add Portfolio Videos

on:
  push:
    branches: [main]
    paths:
      - 'video-update-trigger.txt'

permissions:
  contents: write

jobs:
  patch-video-category:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add video entries
        shell: python
        run: |
          from pathlib import Path

          path = Path('category-data.js')
          text = path.read_text(encoding='utf-8')

          marker = '''      {
        type: "image",
        src: "./封面.png",
        title: "重生后，我撕了白莲妹妹",
        orientation: "video-link",
        href: "https://www.bilibili.com/video/BV1XZEe6KE9Z/"
      },'''

          entries = [
              ("废土温情", "./废土温情_25MB版.mp4"),
              ("猫粮广告", "./猫粮广告_25MB版.mp4"),
              ("耳机广告", "./耳机广告_25MB版.mp4"),
              ("香水广告", "./香水广告.mp4"),
          ]

          if marker not in text:
              raise SystemExit('未找到视频分类插入位置')

          blocks = []
          for title, src in entries:
              if f'title: "{title}"' not in text:
                  blocks.append(f'''      {{
        type: "video",
        src: "{src}",
        title: "{title}",
        orientation: "video-landscape"
      }},
''')

          if blocks:
              text = text.replace(marker, ''.join(blocks) + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add category-data.js
          git commit -m "添加视频作品到视频分类"
          git push
