name: Fix camera banner radius

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-camera-banner-radius.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply radius directly to camera image
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('featured-projects.js')
          text = path.read_text(encoding='utf-8')
          old = '.featured-banner-card-camera img{border-radius:inherit}'
          new = '.featured-banner-card-camera img{border-radius:9px;clip-path:inset(0 round 9px)}'
          if old not in text:
              raise SystemExit('Target camera image style not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add featured-projects.js
          git commit -m "fix: apply rounded clipping to camera banner image"
          git push