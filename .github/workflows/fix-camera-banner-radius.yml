name: Fix camera banner radius

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-camera-banner-radius.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh featured script cache
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('featured.html')
          text = path.read_text(encoding='utf-8')
          old = './featured-projects.js?v=featured-ip-overview-focus-20260616'
          new = './featured-projects.js?v=featured-banner-camera-radius-20260616-2'
          if old not in text:
              raise SystemExit('Target script version not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cache refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add featured.html
          git commit -m "fix: refresh featured script cache for camera radius"
          git push