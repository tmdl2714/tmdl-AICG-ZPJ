name: Fix camera banner radius

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-camera-banner-radius.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force camera banner radius in page CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('featured.html')
          text = path.read_text(encoding='utf-8')
          rule = '    body.featured-page[data-featured="banner"] .featured-banner-card-camera img{border-radius:12px!important;clip-path:inset(0 round 12px)!important;-webkit-clip-path:inset(0 round 12px)!important}\n'
          if rule not in text:
              text = text.replace('  </style>', rule + '  </style>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit page override
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add featured.html
          git commit -m "fix: force rounded corners on camera banner"
          git push