<body class="featured-page">
  <script>
    (()=>{const featuredSlugs=new Set(["ad","banner","poster","drama","ui","ip"]);const params=new URLSearchParams(window.location.search);const slug=params.get("project")||params.get("p")||"ad";document.body.dataset.featured=featuredSlugs.has(slug)?slug:"ad"})();
  </script>
  <main data-featured-page></main>
  <script src="./featured-projects.js?v=featured-ip-overview-focus-20260616" defer></script>
  <script>
    (()=>{
      const posterWorks=[
        {title:"Long Bridge System",src:"./assets/featured-poster-art-bridge.png"},
        {title:"Xu Jin Huan New Arrival",src:"./b64cc7fb-e4b1-4c98-8b1c-e6c5c0eaea00.png"},
        {title:"Lao You Ji",src:"./3b157685-11e4-44e0-b277-f60f370a452a.png"},
        {title:"Luxury Business",src:"./制作海报 (4).png"},
        {title:"Swordsman",src:"./assets/featured-gallery-cards/swordsman.png"}
      ];
      const version="featured-poster-center-scale2-20260616";
      const posterAsset=path=>`${path}?v=${version}`;
      const injectStyles=()=>{
        if(document.getElementById("featured-poster-wall-styles"))return;
        const style=document.createElement("style");
        style.id="featured-poster-wall-styles";
        style.textContent=`
          body.featured-page[data-featured="poster"] .featured-frost-stage{overflow:hidden!important;perspective:1200px!important;perspective-origin:50% 52%!important}
          body.featured-page[data-featured="poster"] .poster-frost-panel{display:none!important}
          .poster-five-wall{position:absolute;inset:0;z-index:4;pointer-events:none;transform-style:preserve-3d}
          .poster-wall-slot{position:absolute;top:55%;display:block;margin:0;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;transform-style:preserve-3d;transition:filter .25s ease,opacity .25s ease}
          .poster-wall-slot:hover{filter:brightness(1.05)}
          .poster-wall-slot:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:7px}
          .poster-wall-slot img{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;object-position:center;border-radius:3px;box-shadow:0 18px 36px rgba(45,73,102,.22),0 0 20px rgba(228,244,255,.2);user-select:none;-webkit-user-drag:none;transition:opacity .22s ease,transform .48s cubic-bezier(.22,.72,.2,1),box-shadow .28s ease}
          .poster-wall-slot.is-swapping img{opacity:.25;transform:scale(.94)}
          .poster-wall-slot[data-slot="0"]{left:10.8%;width:min(10.8vw,158px);transform:translate(-50%,-50%) rotateY(38deg);transform-origin:right center}
          .poster-wall-slot[data-slot="1"]{left:29.2%;width:min(12vw,178px);transform:translate(-50%,-50%) rotateY(20deg);transform-origin:right center}
          .poster-wall-slot[data-slot="2"]{left:50%;top:50%;width:min(32vw,490px);cursor:default;transform:translate(-50%,-50%);transform-origin:center center;z-index:3}
          .poster-wall-slot[data-slot="2"] img{max-height:80vh;box-shadow:0 26px 56px rgba(45,73,102,.28),0 0 34px rgba(228,244,255,.3)}
          .poster-wall-slot[data-slot="3"]{left:70.8%;width:min(12vw,178px);transform:translate(-50%,-50%) rotateY(-20deg);transform-origin:left center}
          .poster-wall-slot[data-slot="4"]{left:89.2%;width:min(10.8vw,158px);transform:translate(-50%,-50%) rotateY(-38deg);transform-origin:left center}
          @media(max-width:820px){.poster-wall-slot[data-slot="0"],.poster-wall-slot[data-slot="4"]{display:none}.poster-wall-slot[data-slot="1"]{left:16%;width:19vw;transform:translate(-50%,-50%) rotateY(16deg)}.poster-wall-slot[data-slot="2"]{top:50%;width:min(50vw,360px)}.poster-wall-slot[data-slot="3"]{left:84%;width:19vw;transform:translate(-50%,-50%) rotateY(-16deg)}}
          @media(prefers-reduced-motion:reduce){.poster-wall-slot img{transition-duration:.01ms!important}}
        `;
        document.head.appendChild(style);
      };
      const render=()=>{
        if(document.body.dataset.featured!=="poster")return;
        const stage=document.querySelector(".featured-poster-frost-page .featured-frost-stage");
        if(!stage)return;
        injectStyles();
        let order=[0,1,2,3,4];
        stage.setAttribute("aria-label","03竖版海报五面展墙，点击两侧海报与中央互换");
        stage.innerHTML=`<div class="poster-five-wall">${order.map((workIndex,slot)=>`<button class="poster-wall-slot" type="button" data-slot="${slot}" aria-label="${slot===2?"中央展示：":"点击展示："}${posterWorks[workIndex].title}"><img src="${posterAsset(posterWorks[workIndex].src)}" alt="${posterWorks[workIndex].title}" loading="eager" decoding="async" ${slot===2?'fetchpriority="high"':''}></button>`).join("")}</div>`;
        const slots=[...stage.querySelectorAll(".poster-wall-slot")];
        const updateSlot=(slotIndex)=>{const button=slots[slotIndex];const work=posterWorks[order[slotIndex]];const img=button.querySelector("img");img.src=posterAsset(work.src);img.alt=work.title;button.setAttribute("aria-label",`${slotIndex===2?"中央展示：":"点击展示："}${work.title}`)};
        slots.forEach((button,slotIndex)=>{
          if(slotIndex===2)return;
          button.addEventListener("click",()=>{
            const center=2;
            const clicked=slots[slotIndex];
            const main=slots[center];
            clicked.classList.add("is-swapping");
            main.classList.add("is-swapping");
            window.setTimeout(()=>{
              [order[slotIndex],order[center]]=[order[center],order[slotIndex]];
              updateSlot(slotIndex);updateSlot(center);
              requestAnimationFrame(()=>{clicked.classList.remove("is-swapping");main.classList.remove("is-swapping")});
            },180);
          });
        });
      };
      window.addEventListener("DOMContentLoaded",()=>requestAnimationFrame(render),{once:true});
    })();
  </script>
  <script>
    (()=>{
      const renderIp=()=>{
        if(document.body.dataset.featured!=="ip")return;
        const stage=document.querySelector(".featured-ip-frost-page .featured-frost-stage");
        if(!stage)return;
        const oldStyle=document.getElementById("featured-ip-flip-styles");
        if(oldStyle)oldStyle.remove();
        const style=document.createElement("style");
        style.id="featured-ip-overview-focus-styles";
        style.textContent=`
          body.featured-page[data-featured="ip"] .featured-frost-stage{overflow:hidden!important;perspective:1400px!important;perspective-origin:50% 52%!important}
          .ip-overview-focus{position:absolute;inset:0;z-index:4;perspective:1400px;transform-style:preserve-3d}
          .ip-overview{position:absolute;left:50%;top:54%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(22px,3vw,52px);width:min(76vw,1120px);transform:translate(-50%,-50%);transition:opacity .34s ease,transform .62s cubic-bezier(.22,.72,.2,1);transform-style:preserve-3d}
          .ip-overview-card{position:relative;display:block;width:100%;aspect-ratio:3/2;margin:0;padding:0;overflow:hidden;border:1px solid rgba(198,224,243,.55);border-radius:12px;background:rgba(235,247,255,.32);box-shadow:0 24px 58px rgba(49,82,116,.22),0 0 30px rgba(174,220,250,.18);cursor:pointer;transition:transform .42s cubic-bezier(.22,.72,.2,1),box-shadow .28s ease,border-color .28s ease;backdrop-filter:blur(8px)}
          .ip-overview-card:hover,.ip-overview-card:focus-visible{border-color:rgba(218,170,86,.76);box-shadow:0 28px 66px rgba(49,82,116,.28),0 0 32px rgba(218,170,86,.2);transform:translateY(-6px);outline:none}
          .ip-overview-card img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}
          .ip-focus-shell{position:absolute;left:50%;top:52%;width:min(64vw,980px);aspect-ratio:3/2;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.74);transition:opacity .3s ease,transform .68s cubic-bezier(.18,.78,.18,1);transform-style:preserve-3d}
          .ip-focus-card{position:absolute;inset:0;border-radius:12px;transform:rotateY(var(--ip-rotation,0deg));transform-origin:center;transform-style:preserve-3d;transition:transform 780ms cubic-bezier(.22,.72,.2,1);will-change:transform}
          .ip-focus-face{position:absolute;inset:0;margin:0;overflow:hidden;border:1px solid rgba(198,224,243,.62);border-radius:12px;background:rgba(235,247,255,.35);box-shadow:0 30px 78px rgba(45,76,110,.3),0 0 38px rgba(174,220,250,.22);backface-visibility:hidden;-webkit-backface-visibility:hidden}
          .ip-focus-face-back{transform:rotateY(180deg)}
          .ip-focus-face img{display:block;width:100%;height:100%;object-fit:cover;object-position:center;user-select:none;-webkit-user-drag:none}
          .ip-focus-arrow{position:absolute;top:50%;z-index:5;display:grid;place-items:center;width:clamp(38px,3.4vw,52px);aspect-ratio:1;padding:0;border:1px solid rgba(221,242,255,.5);border-radius:50%;background:linear-gradient(145deg,rgba(10,36,64,.42),rgba(222,243,255,.16));box-shadow:0 12px 30px rgba(12,35,64,.22),inset 0 1px rgba(255,255,255,.4);color:rgba(246,253,255,.9);opacity:.68;cursor:pointer;transform:translateY(-50%);backdrop-filter:blur(12px);transition:opacity .18s ease,border-color .18s ease,box-shadow .18s ease}
          .ip-focus-arrow-left{left:max(-70px,-5vw)}.ip-focus-arrow-right{right:max(-70px,-5vw)}
          .ip-focus-arrow::before{width:30%;height:30%;border-top:1.8px solid currentColor;border-left:1.8px solid currentColor;content:""}
          .ip-focus-arrow-left::before{transform:translateX(12%) rotate(-45deg)}.ip-focus-arrow-right::before{transform:translateX(-12%) rotate(135deg)}
          .ip-focus-arrow:hover,.ip-focus-arrow:focus-visible{border-color:rgba(255,255,255,.82);box-shadow:0 12px 30px rgba(12,35,64,.26),0 0 22px rgba(174,223,255,.32);opacity:1;outline:none}
          .ip-overview-focus.is-focused .ip-overview{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.82)}
          .ip-overview-focus.is-focused .ip-focus-shell{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
          @media(max-width:820px){.ip-overview{top:54%;width:min(90vw,700px);gap:12px}.ip-overview-card{border-radius:8px}.ip-focus-shell{top:53%;width:min(82vw,720px)}.ip-focus-arrow{width:36px}.ip-focus-arrow-left{left:max(-44px,-6vw)}.ip-focus-arrow-right{right:max(-44px,-6vw)}}
          @media(prefers-reduced-motion:reduce){.ip-overview,.ip-overview-card,.ip-focus-shell,.ip-focus-card{transition-duration:.01ms!important}}
        `;
        document.head.appendChild(style);
        stage.setAttribute("aria-label","06 IP设计作品展示，初始双图并排，点击后放大并旋转交换");
        stage.innerHTML=`<div class="ip-overview-focus" data-ip-layout><div class="ip-overview"><button class="ip-overview-card" type="button" data-ip-open="0" aria-label="放大山海月IP"><img src="./山海月IP.png?v=featured-ip-overview-focus-20260616" alt="山海月IP" loading="eager" decoding="async" fetchpriority="high"></button><button class="ip-overview-card" type="button" data-ip-open="1" aria-label="放大欢狐IP"><img src="./IP综合1.0.png?v=featured-ip-overview-focus-20260616" alt="欢狐IP综合设计" loading="eager" decoding="async"></button></div><div class="ip-focus-shell"><div class="ip-focus-card" data-ip-card><figure class="ip-focus-face ip-focus-face-front"><img src="./山海月IP.png?v=featured-ip-overview-focus-20260616" alt="山海月IP"></figure><figure class="ip-focus-face ip-focus-face-back"><img src="./IP综合1.0.png?v=featured-ip-overview-focus-20260616" alt="欢狐IP综合设计"></figure></div><button class="ip-focus-arrow ip-focus-arrow-left" type="button" data-ip-rotate="left" aria-label="向左旋转交换作品"></button><button class="ip-focus-arrow ip-focus-arrow-right" type="button" data-ip-rotate="right" aria-label="向右旋转交换作品"></button></div></div>`;
        const layout=stage.querySelector("[data-ip-layout]");
        const card=stage.querySelector("[data-ip-card]");
        let rotation=0;
        stage.querySelectorAll("[data-ip-open]").forEach(button=>button.addEventListener("click",event=>{event.stopPropagation();rotation=button.dataset.ipOpen==="1"?180:0;card.style.setProperty("--ip-rotation",`${rotation}deg`);layout.classList.add("is-focused")}));
        stage.querySelectorAll("[data-ip-rotate]").forEach(button=>button.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();rotation+=button.dataset.ipRotate==="left"?-180:180;card.style.setProperty("--ip-rotation",`${rotation}deg`)}));
        stage.addEventListener("click",event=>{if(layout.classList.contains("is-focused")&&(event.target===stage||event.target===layout)){layout.classList.remove("is-focused")}});
        document.addEventListener("keydown",event=>{if(event.key==="Escape")layout.classList.remove("is-focused")});
      };
      window.addEventListener("DOMContentLoaded",()=>requestAnimationFrame(renderIp),{once:true});
    })();
  </script>
  <script>
    (()=>{const loadAdVideo=()=>{document.querySelectorAll('body[data-featured="ad"] video[data-src]').forEach(video=>{if(!video.src){video.src=video.dataset.src;video.load()}})};if(document.readyState==="loading")window.addEventListener("DOMContentLoaded",()=>requestAnimationFrame(loadAdVideo),{once:true});else requestAnimationFrame(loadAdVideo)})();
  </script>
</body>
