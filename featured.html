    @media(max-width:820px){body.featured-page[data-featured="ad"] .ad-work-video-frame{top:56%!important;width:min(88vw,760px)!important}body.featured-page[data-featured="drama"] .featured-drama-player-shell,body.featured-page[data-featured="ui"] .ui-frost-panel{top:max(118px,calc(var(--ref-stage-y) + var(--ref-stage-h) * .14))!important}body.featured-page[data-featured="poster"] .poster-frost-panel{top:max(118px,calc(var(--ref-stage-y) + var(--ref-stage-h) * .13))!important;width:min(60vw,calc(100vh - 150px) * .75)!important}body.featured-page[data-featured="ui"] .ui-frost-panel.ui-frost-gallery{width:min(92vw,720px)!important;gap:8px!important}body.featured-page[data-featured="ui"] .ui-frost-work{border-radius:16px!important;padding:4px!important}body.featured-page[data-featured="ui"] .ui-frost-work::before{inset:-9px!important;border-radius:22px!important;filter:blur(8px)!important}body.featured-page[data-featured="ui"] .ui-frost-gallery .ui-frost-art{border-radius:12px!important}}

</head>
<body class="featured-page">
  <script>
    (()=>{const featuredSlugs=new Set(["ad","banner","poster","drama","ui","ip"]);const params=new URLSearchParams(window.location.search);const slug=params.get("project")||params.get("p")||"ad";document.body.dataset.featured=featuredSlugs.has(slug)?slug:"ad"})();
  </script>
  <main data-featured-page></main>
  <script src="./featured-projects.js?v=featured-banner-scale-radius-20260616" defer></script>
  <script src="./featured-ad-thumbnails.js?v=featured-ad-thumbs-20260624" defer></script>
  <script src="./featured-ip.js?v=featured-ip-overview-focus-20260616-final" defer></script>
  <script src="./featured-drama-shanhai.js?v=featured-drama-shanhai-biaoju-20260624" defer></script>
  <script>
    (()=>{
      const posterWorks=[
        {title:"Xu Jin Huan New Arrival",src:"./b64cc7fb-e4b1-4c98-8b1c-e6c5c0eaea00.png"},
        {title:"Lao You Ji",src:"./3b157685-11e4-44e0-b277-f60f370a452a.png"},
        {title:"Long Bridge System",src:"./assets/featured-poster-art-bridge.png"},
        {title:"Luxury Business",src:"./制作海报 (4).png"},
        {title:"Shougang Park",src:"./首钢园.png"}
      ];
      const version="featured-poster-shougang-hd-20260616";
      const posterAsset=path=>`${path}?v=${version}`;
      const injectStyles=()=>{
        if(document.getElementById("featured-poster-wall-styles"))return;
        const style=document.createElement("style");
        style.id="featured-poster-wall-styles";
        style.textContent=`
          body.featured-page[data-featured="poster"] .featured-frost-stage{overflow:hidden!important;perspective:1200px!important;perspective-origin:50% 52%!important}
          body.featured-page[data-featured="poster"] .poster-frost-panel{display:none!important}
          .poster-five-wall{position:absolute;inset:0;z-index:4;pointer-events:none;transform-style:preserve-3d}
          .poster-wall-slot{position:absolute;top:55%;display:flex;align-items:center;justify-content:center;margin:0;padding:0;border:0;background:transparent;cursor:pointer;pointer-events:auto;transform-style:preserve-3d;transition:filter .25s ease,opacity .25s ease}
          .poster-wall-slot:hover{filter:brightness(1.05)}
          .poster-wall-slot:focus-visible{outline:2px solid rgba(255,255,255,.9);outline-offset:7px}
          .poster-wall-slot img{display:block;width:auto;height:auto;max-width:100%;max-height:62vh;object-fit:contain;object-position:center;border-radius:3px;box-shadow:0 18px 36px rgba(45,73,102,.22),0 0 20px rgba(228,244,255,.2);user-select:none;-webkit-user-drag:none;transition:opacity .22s ease,transform .48s cubic-bezier(.22,.72,.2,1),box-shadow .28s ease}
          .poster-wall-slot.is-swapping img{opacity:.25;transform:scale(.94)}
          .poster-wall-slot[data-slot="0"]{left:8.5%;width:min(11vw,164px);transform:translate(-50%,-50%) rotateY(38deg);transform-origin:right center}
          .poster-wall-slot[data-slot="1"]{left:24%;width:min(12vw,178px);transform:translate(-50%,-50%) rotateY(20deg);transform-origin:right center}
          .poster-wall-slot[data-slot="2"]{left:50%;top:50%;width:min(32vw,490px);cursor:default;transform:translate(-50%,-50%);transform-origin:center center;z-index:3}
          .poster-wall-slot[data-slot="2"] img{max-width:100%;max-height:80vh;box-shadow:0 26px 56px rgba(45,73,102,.28),0 0 34px rgba(228,244,255,.3)}
          .poster-wall-slot[data-slot="3"]{left:76%;width:min(12vw,178px);transform:translate(-50%,-50%) rotateY(-20deg);transform-origin:left center}
          .poster-wall-slot[data-slot="4"]{left:91.5%;width:min(11vw,164px);transform:translate(-50%,-50%) rotateY(-38deg);transform-origin:left center}
          @media(max-width:820px){.poster-wall-slot[data-slot="0"],.poster-wall-slot[data-slot="4"]{display:none}.poster-wall-slot[data-slot="1"]{left:13%;width:18vw;transform:translate(-50%,-50%) rotateY(16deg)}.poster-wall-slot[data-slot="2"]{top:50%;width:min(50vw,360px)}.poster-wall-slot[data-slot="3"]{left:87%;width:18vw;transform:translate(-50%,-50%) rotateY(-16deg)}}
        `;
        document.head.appendChild(style);
      };
      const render=()=>{
        if(document.body.dataset.featured!=="poster")return;
        const stage=document.querySelector(".featured-poster-frost-page .featured-frost-stage");
        if(!stage)return;
        injectStyles();
        let order=[0,1,2,3,4];
        stage.setAttribute("aria-label","03竖版海报五面展墙，点击两侧海报与中央互换");
        stage.innerHTML=`<div class="poster-five-wall">${order.map((workIndex,slot)=>`<button class="poster-wall-slot" type="button" data-slot="${slot}" aria-label="${slot===2?"中央展示：":"点击展示："}${posterWorks[workIndex].title}"><img src="${posterAsset(posterWorks[workIndex].src)}" alt="${posterWorks[workIndex].title}" loading="${slot===2?"eager":"lazy"}" decoding="async" ${slot===2?'fetchpriority="high"':''}></button>`).join("")}</div>`;
        const slots=[...stage.querySelectorAll(".poster-wall-slot")];
        const updateSlot=(slotIndex)=>{const button=slots[slotIndex];const work=posterWorks[order[slotIndex]];const img=button.querySelector("img");img.src=posterAsset(work.src);img.alt=work.title;button.setAttribute("aria-label",`${slotIndex===2?"中央展示：":"点击展示："}${work.title}`)};
        slots.forEach((button,slotIndex)=>{
          if(slotIndex===2)return;
          button.addEventListener("click",()=>{
            const center=2;
            const clicked=slots[slotIndex];
            const main=slots[center];
            clicked.classList.add("is-swapping");
            main.classList.add("is-swapping");
            window.setTimeout(()=>{
              [order[slotIndex],order[center]]=[order[center],order[slotIndex]];
              updateSlot(slotIndex);updateSlot(center);
              requestAnimationFrame(()=>{clicked.classList.remove("is-swapping");main.classList.remove("is-swapping")});
            },180);
          });
        });
      };
      window.addEventListener("DOMContentLoaded",()=>requestAnimationFrame(render),{once:true});
    })();
  </script>
  <script>
    (()=>{const loadAdVideo=()=>{document.querySelectorAll('body[data-featured="ad"] video[data-src]').forEach(video=>{if(!video.src){video.src=video.dataset.src;video.load()}})};if(document.readyState==="loading")window.addEventListener("DOMContentLoaded",()=>requestAnimationFrame(loadAdVideo),{once:true});else requestAnimationFrame(loadAdVideo)})();
  </script>
</body>
</html>
