<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来东方 AI 数字艺术馆</title>
  <meta name="description" content="铁马德龙作品集精品项目二级页面，未来东方 AI 数字艺术馆展厅。">
  <link rel="stylesheet" href="./styles.css?v=ad-hide-next-20260606">
  <style>
    body.featured-page[data-featured="ad"] .featured-ad-reference-page {
      position: relative !important;
      width: 100vw !important;
      min-width: 0 !important;
      min-height: 100vh !important;
      height: 100vh !important;
      overflow: hidden !important;
      background: url("./01.2.png?v=featured-ad-bg-20260612") center center / cover no-repeat #020913 !important;
      isolation: isolate !important;
    }

    body.featured-page[data-featured="ad"] .featured-ad-reference-page::before,
    body.featured-page[data-featured="ad"] .featured-ad-reference-page::after,
    body.featured-page[data-featured="ad"] .featured-ad-reference-art {
      display: none !important;
      content: none !important;
    }

    body.featured-page[data-featured="ad"] .ad-work-video-frame {
      position: absolute !important;
      top: 55% !important;
      left: 50% !important;
      z-index: 4 !important;
      width: min(74vw, 1120px) !important;
      aspect-ratio: 16 / 9 !important;
      overflow: hidden !important;
      border: 1px solid rgba(194, 226, 255, 0.38) !important;
      border-radius: 10px !important;
      background: rgba(2, 8, 18, 0.58) !important;
      box-shadow: 0 30px 88px rgba(0, 8, 22, 0.46), 0 0 42px rgba(89, 164, 255, 0.2) !important;
      transform: translate(-50%, -50%) !important;
    }

    body.featured-page[data-featured="ad"] .ad-work-video {
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      object-position: center center !important;
      background: #020812 !important;
    }

    body.featured-page[data-featured="ad"] .ad-ref-crisp-nav {
      z-index: 6 !important;
    }

    body.featured-page[data-featured="banner"] .banner-frost-panel,
    body.featured-page[data-featured="poster"] .poster-frost-panel,
    body.featured-page[data-featured="drama"] .featured-drama-player-shell {
      top: calc(var(--ref-stage-y) + var(--ref-stage-h) * 0.148) !important;
    }

    body.featured-page[data-featured="ui"] .ui-frost-panel {
      top: calc(var(--ref-stage-y) + var(--ref-stage-h) * 0.152) !important;
    }

    @media (max-width: 820px) {
      body.featured-page[data-featured="ad"] .ad-work-video-frame {
        top: 56% !important;
        width: min(88vw, 760px) !important;
      }

      body.featured-page[data-featured="banner"] .banner-frost-panel,
      body.featured-page[data-featured="poster"] .poster-frost-panel,
      body.featured-page[data-featured="drama"] .featured-drama-player-shell,
      body.featured-page[data-featured="ui"] .ui-frost-panel {
        top: max(118px, calc(var(--ref-stage-y) + var(--ref-stage-h) * 0.14)) !important;
      }
    }
  </style>
</head>
<body class="featured-page">
  <script>
    (() => {
      const featuredSlugs = new Set(["ad", "banner", "poster", "drama", "ui", "ip"]);
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("project") || params.get("p") || "ad";
      document.body.dataset.featured = featuredSlugs.has(slug) ? slug : "ad";
    })();
  </script>
  <main data-featured-page></main>

  <script src="./featured-projects.js?v=featured-ip-shanhai-20260612" defer></script>
  <script>
    (() => {
      const loadAdVideo = () => {
        document.querySelectorAll('body[data-featured="ad"] video[data-src]').forEach((video) => {
          if (!video.src) {
            video.src = video.dataset.src;
            video.load();
          }
        });
      };

      if (document.readyState === "loading") {
        window.addEventListener("DOMContentLoaded", () => requestAnimationFrame(loadAdVideo), { once: true });
      } else {
        requestAnimationFrame(loadAdVideo);
      }
    })();
  </script>
</body>
</html>
