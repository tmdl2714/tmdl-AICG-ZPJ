  <style>
    body.category-page[data-category="poster"] .category-work-grid{display:grid!important;grid-template-columns:repeat(30,minmax(0,1fr))!important;gap:clamp(12px,1.4vw,18px)!important;align-items:start!important}
    body.category-page[data-category="poster"] .work-card.is-banner,body.category-page[data-category="poster"] .work-card.is-banner:nth-child(n){grid-column:span 15!important;aspect-ratio:16/9!important;min-height:0!important;padding:0!important;border-radius:10px!important}
    body.category-page[data-category="poster"] .work-card.is-activity-poster,body.category-page[data-category="poster"] .work-card.is-activity-poster:nth-child(n){grid-column:span 5!important;aspect-ratio:4/9!important;min-height:0!important;padding:clamp(3px,.45vw,6px)!important;border:1px solid rgba(175,214,255,.58)!important;border-radius:14px!important;background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(226,240,255,.22))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.82),0 12px 28px rgba(23,62,108,.13),0 0 0 1px rgba(255,255,255,.18)!important;overflow:hidden!important}
    body.category-page[data-category="poster"] .work-card.is-activity-poster img{width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;border-radius:9px!important;background:transparent!important}
    body.category-page[data-category="poster"] .work-card.is-activity-poster span{display:none!important}
    body.category-page[data-category="poster"] .work-card.is-vertical,body.category-page[data-category="poster"] .work-card.is-vertical:nth-child(n){grid-column:span 6!important;aspect-ratio:3/4!important;min-height:0!important}

    @media(max-width:760px){body.category-page[data-category="poster"] .category-work-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}body.category-page[data-category="poster"] .work-card.is-banner{grid-column:span 2!important}body.category-page[data-category="poster"] .work-card.is-activity-poster,body.category-page[data-category="poster"] .work-card.is-vertical{grid-column:span 1!important}}
