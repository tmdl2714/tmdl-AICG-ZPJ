<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类项目 - 铁马德龙作品集</title>
  <meta name="description" content="铁马德龙作品集分类项目二级页面。">
  <link rel="stylesheet" href="./styles.css?v=poster-card-local-20260623">
  <link rel="stylesheet" href="./category-process.css?v=poster-card-local-20260623">
  <style>
    body.category-page[data-category="poster"] .category-work-grid{
      grid-template-columns:repeat(12,minmax(0,1fr))!important;
      gap:clamp(12px,1.45vw,20px)!important;
      align-items:start!important;
    }
    body.category-page[data-category="poster"] .work-card.is-banner,
    body.category-page[data-category="poster"] .work-card.is-banner:nth-child(n){
      grid-column:span 6!important;
      aspect-ratio:16/9!important;
    }
    body.category-page[data-category="poster"] .work-card.is-poster-row,
    body.category-page[data-category="poster"] .work-card.is-poster-row:nth-child(n){
      grid-column:span 2!important;
      aspect-ratio:9/16!important;
      padding:clamp(3px,.45vw,6px)!important;
      border:1px solid rgba(175,214,255,.58)!important;
      border-radius:14px!important;
      background:linear-gradient(145deg,rgba(255,255,255,.68),rgba(226,240,255,.22))!important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.82),0 12px 28px rgba(23,62,108,.13),0 0 0 1px rgba(255,255,255,.18)!important;
      overflow:hidden!important;
    }
    body.category-page[data-category="poster"] .work-card.is-poster-row::before{
      content:""!important;
      position:absolute!important;
      inset:0!important;
      z-index:0!important;
      border-radius:inherit!important;
      background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(255,255,255,0) 44%,rgba(116,190,255,.1))!important;
      pointer-events:none!important;
    }
    body.category-page[data-category="poster"] .work-card.is-poster-row img{
      position:relative!important;
      z-index:1!important;
      width:100%!important;
      height:100%!important;
      max-width:none!important;
      max-height:none!important;
      object-fit:cover!important;
      object-position:center center!important;
      border-radius:10px!important;
      background:transparent!important;
      filter:drop-shadow(0 5px 10px rgba(26,62,100,.12))!important;
    }
    body.category-page[data-category="poster"] .work-card.is-poster-row span{
      display:none!important;
    }
    @media(max-width:1180px){
      body.category-page[data-category="poster"] .category-work-grid{grid-template-columns:repeat(6,minmax(0,1fr))!important;}
      body.category-page[data-category="poster"] .work-card.is-banner,
      body.category-page[data-category="poster"] .work-card.is-banner:nth-child(n){grid-column:span 3!important;}
      body.category-page[data-category="poster"] .work-card.is-poster-row,
      body.category-page[data-category="poster"] .work-card.is-poster-row:nth-child(n){grid-column:span 1!important;}
    }
    @media(max-width:760px){
      body.category-page[data-category="poster"] .category-work-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
      body.category-page[data-category="poster"] .work-card.is-banner,
      body.category-page[data-category="poster"] .work-card.is-banner:nth-child(n){grid-column:span 2!important;}
      body.category-page[data-category="poster"] .work-card.is-poster-row,
      body.category-page[data-category="poster"] .work-card.is-poster-row:nth-child(n){grid-column:span 1!important;}
    }
  </style>
</head>
<body class="category-page">
  <main class="category-detail" data-category-page></main>

  <div class="work-viewer" aria-hidden="true">
    <button class="viewer-close" type="button" data-preview-close aria-label="关闭预览">×</button>
    <button class="viewer-nav viewer-prev" type="button" data-preview-prev aria-label="上一个作品"><span class="icon" data-icon="chevron-left"></span></button>
    <div class="work-viewer-media" role="dialog" aria-modal="true" aria-label="作品预览"></div>
    <button class="viewer-nav viewer-next" type="button" data-preview-next aria-label="下一个作品"><span class="icon" data-icon="chevron-right"></span></button>
  </div>

  <script src="./script.js?v=poster-card-local-20260623" defer></script>
  <script src="./category-data.js?v=poster-card-local-20260623" defer></script>
  <script src="./category-ui-replacement.js?v=poster-card-local-20260623" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      if (!window.CATEGORY_DATA?.video?.works) return;
      const wasteWork = window.CATEGORY_DATA.video.works.find((work) => work.title === "废土温情");
      if (wasteWork) wasteWork.poster = "./废土温情.png";
      const earWork = window.CATEGORY_DATA.video.works.find((work) => work.title === "耳机广告");
      if (earWork) earWork.poster = "./小耳机.png";
      window.CATEGORY_DATA.video.works.splice(-2, 2,
        { type: "video", src: "./渡鸦的礼物.mp4", title: "渡鸦的礼物", orientation: "video-landscape", poster: "./渡鸦的礼物.png" },
        { type: "video", src: "./山海镖局_GitHub_25MB内.mp4", title: "山海镖局", orientation: "video-landscape", poster: "./山海镖局.png" }
      );
    }, { once: true });
  </script>
  <script src="./category-performance-runtime.js?v=poster-card-local-20260623" defer></script>
  <script src="./category-page.js?v=poster-card-local-20260623" defer></script>
  <script src="./category-poster-banner-blur.js?v=poster-card-local-20260623" defer></script>
  <script src="./category-video-posters.js?v=poster-card-local-20260623" defer></script>
  <script src="./category-video-click-play.js?v=poster-card-local-20260623" defer></script>
</body>
</html>
