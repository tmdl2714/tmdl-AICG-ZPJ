<body class="category-page">
  <main class="category-detail" data-category-page></main>

  <div class="work-viewer" aria-hidden="true">
    <button class="viewer-close" type="button" data-preview-close aria-label="关闭预览">×</button>
    <button class="viewer-nav viewer-prev" type="button" data-preview-prev aria-label="上一个作品">
      <span class="icon" data-icon="chevron-left"></span>
    </button>
    <div class="work-viewer-media" role="dialog" aria-modal="true" aria-label="作品预览"></div>
    <button class="viewer-nav viewer-next" type="button" data-preview-next aria-label="下一个作品">
      <span class="icon" data-icon="chevron-right"></span>
    </button>
  </div>

  <script src="./script.js?v=perf-loading-20260612" defer></script>
  <script src="./category-data.js?v=next-banner-aspect-20260612" defer></script>
  <script src="./category-page.js?v=next-card-20260612" defer></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const nextMap = {
        portrait: "outfit",
        outfit: "retouch",
        retouch: "poster",
        poster: "ip",
        ip: "typography",
        typography: "symbol",
        symbol: "ui",
        ui: "icon",
        icon: "video",
        video: "portrait"
      };
      const labels = {
        portrait: "AI写真",
        outfit: "电商模特换装",
        retouch: "产品精修",
        poster: "海报Banner",
        ip: "IP设计",
        typography: "字体设计",
        symbol: "超级符号",
        ui: "UI启动页",
        icon: "ICON",
        video: "视频 / 漫剧"
      };

      requestAnimationFrame(() => {
        const current = document.body.dataset.category || new URLSearchParams(window.location.search).get("cat") || "portrait";
        const next = nextMap[current] || "portrait";
        const card = document.querySelector(".category-next");
        if (!card) return;

        card.classList.add("category-next-card");
        card.href = `./category.html?cat=${encodeURIComponent(next)}`;
        card.setAttribute("aria-label", `下一项目：${labels[next] || next}`);
        card.replaceChildren();

        const image = document.createElement("img");
        image.className = "category-next-image";
        image.src = `./assets/next/next-${next}.png`;
        image.alt = labels[next] || "下一项目";
        image.loading = "lazy";
        image.decoding = "async";
        image.width = 2048;
        image.height = 320;
        image.onerror = () => {
          image.hidden = true;
          card.classList.add("is-missing");
        };
        card.appendChild(image);
      });
    });
  </script>
